<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#526b91">
  <link rel="manifest" href="manifest.json">
  <title>認知課題トレーニング</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f6fa;
      color: #273449;
      font-family: sans-serif;
    }

    main {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 20px;
      text-align: center;
    }

    h1 { color: #354b6b; }

    button, input, select {
      font-size: 18px;
      padding: 14px;
      border-radius: 12px;
    }

    input, select {
      width: 100%;
      border: 1px solid #bdc9d9;
      margin: 8px 0 18px;
    }

    button {
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #526b91;
      color: white;
      width: 100%;
    }

    .rule {
      background: #edf2f8;
      padding: 18px;
      border-radius: 12px;
      font-size: 21px;
      font-weight: bold;
      margin: 20px 0;
    }

    .shape-area {
      min-height: 200px;
      display: grid;
      place-items: center;
      background: #fafbfd;
      border-radius: 15px;
      margin: 20px 0;
    }

    .shape {
      width: 110px;
      height: 110px;
    }

    .targets {
      display: flex;
      gap: 12px;
    }

    .target {
      flex: 1;
      min-height: 100px;
      background: #e9eef6;
      color: #354b6b;
    }

    .hidden { display: none; }

    #feedback {
      min-height: 35px;
      font-size: 20px;
      font-weight: bold;
      margin: 15px;
    }

    @media(max-width:480px) {
      body { padding: 10px; }
      main { padding: 18px; }
    }
  </style>
</head>

<body>
<main>

  <section id="home">
    <h1>認知課題トレーニング</h1>
    <p>ルールに従って図形を分類しましょう。</p>

    <label>参加者ID</label>
    <input id="participant" placeholder="例：P001">

    <label>難易度</label>
    <select id="level">
      <option value="1">Lv.1 色で分類</option>
      <option value="2">Lv.2 形で分類</option>
    </select>

    <div class="rule" id="homeRule">
      赤色は左、青色は右
    </div>

    <button class="primary" onclick="startGame()">
      開始する
    </button>
  </section>

  <section id="game" class="hidden">
    <h2 id="questionNumber"></h2>

    <div class="rule" id="gameRule"></div>

    <div class="shape-area" id="shapeArea"></div>

    <div class="targets">
      <button class="target" onclick="answer('left')">
        左に分類
      </button>

      <button class="target" onclick="answer('right')">
        右に分類
      </button>
    </div>

    <div id="feedback"></div>
  </section>

  <section id="result" class="hidden">
    <h1>課題終了</h1>
    <h2 id="score"></h2>
    <p id="accuracy"></p>
    <button class="primary" onclick="location.reload()">
      もう一度
    </button>
  </section>

</main>

<script>
let participantId = "";
let level = 1;
let current = null;
let count = 0;
let correct = 0;
let startedAt = 0;
let records = [];

function ruleText() {
  return level === 1
    ? "赤色は左、青色は右"
    : "丸は左、三角は右";
}

document.getElementById("level").onchange = function() {
  level = Number(this.value);
  document.getElementById("homeRule").textContent = ruleText();
};

function startGame() {
  participantId = document.getElementById("participant").value.trim();
  if (!participantId) {
    alert("参加者IDを入力してください");
    return;
  }

  level = Number(document.getElementById("level").value);

  document.getElementById("home").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  document.getElementById("gameRule").textContent = ruleText();

  nextQuestion();
}

function nextQuestion() {
  if (count >= 10) {
    finishGame();
    return;
  }

  const color = Math.random() < 0.5 ? "red" : "blue";
  const shape = Math.random() < 0.5 ? "circle" : "triangle";

  let answerSide;

  if (level === 1) {
    answerSide = color === "red" ? "left" : "right";
  } else {
    answerSide = shape === "circle" ? "left" : "right";
  }

  current = {
    color,
    shape,
    answerSide
  };

  const shapeHTML = shape === "circle"
    ? `<circle cx="55" cy="55" r="45" fill="${color}"/>`
    : `<polygon points="55,5 105,100 5,100" fill="${color}"/>`;

  document.getElementById("shapeArea").innerHTML = `
    <svg class="shape" viewBox="0 0 110 110">
      ${shapeHTML}
    </svg>
  `;

  document.getElementById("questionNumber").textContent =
    `${count + 1} / 10 問`;

  document.getElementById("feedback").textContent = "";

  startedAt = performance.now();
}

function answer(side) {
  if (!current) return;

  const reactionTime = Math.round(
    performance.now() - startedAt
  );

  const isCorrect = side === current.answerSide;

  if (isCorrect) correct++;

  records.push({
    participantId,
    level,
    trial: count + 1,
    color: current.color,
    shape: current.shape,
    answer: side,
    correct: isCorrect,
    reactionTimeMs: reactionTime,
    timestamp: new Date().toISOString()
  });

  count++;

  document.getElementById("feedback").textContent =
    isCorrect ? "正解です！" : "もう一度確認しましょう";

  current = null;

  setTimeout(nextQuestion, 700);
}

function finishGame() {
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("score").textContent =
    `${correct} / 10 問正解`;

  document.getElementById("accuracy").textContent =
    `正答率：${correct * 10}%`;

  localStorage.setItem(
    "cognitiveTrainingRecords",
    JSON.stringify(records)
  );
}
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
